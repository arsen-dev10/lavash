<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Отзывы — Админ панель</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="admin-layout">

  <aside class="sidebar">
    <div class="sidebar-logo"><i class="fas fa-mountain"></i><div><span>VisitKyrgyzstan</span><small>Admin Panel</small></div></div>
    <nav class="sidebar-menu">
      <div class="menu-section">Главное</div>
      <a href="dashboard.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Дашборд</a>
      <div class="menu-section">Контент</div>
      <a href="places.html"  class="menu-item"><i class="fas fa-map-marker-alt"></i> Места</a>
      <a href="routes.html"  class="menu-item"><i class="fas fa-route"></i> Маршруты</a>
      <a href="reviews.html" class="menu-item active"><i class="fas fa-star"></i> Отзывы</a>
      <div class="menu-section">Система</div>
      <a href="settings.html"  class="menu-item"><i class="fas fa-cog"></i> Настройки</a>
      <a href="../index.html" class="menu-item" target="_blank"><i class="fas fa-external-link-alt"></i> Открыть сайт</a>
      <a href="#" class="menu-item" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Выход</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button id="adminBurger" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--a-gray)"><i class="fas fa-bars"></i></button>
        <div>
          <div class="topbar-title">Отзывы</div>
          <div class="topbar-breadcrumb"><a href="dashboard.html">Дашборд</a> <i class="fas fa-chevron-right"></i> <span>Отзывы</span></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-user"><div class="avatar">A</div><span>Admin</span></div>
        <button class="logout-btn" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>

    <div class="page-body">
      <div class="page-header">
        <div><h1>Управление отзывами</h1><p>Просматривайте и модерируйте отзывы туристов</p></div>
        <div style="display:flex;gap:.75rem">
          <button class="btn btn-danger" onclick="deleteAllUserReviews()"><i class="fas fa-trash"></i> Очистить пользовательские</button>
          <button class="btn btn-ghost" onclick="renderReviewsAdmin()"><i class="fas fa-sync"></i> Обновить</button>
        </div>
      </div>

      <!-- СТАТИСТИКА ОТЗЫВОВ -->
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.5rem" id="reviewStatsGrid"></div>

      <!-- ФИЛЬТРЫ -->
      <div class="filter-bar">
        <div class="search-input-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="reviewSearch" placeholder="Поиск по автору или тексту..." oninput="renderReviewsAdmin()" />
        </div>
        <select class="filter-select" id="reviewPlaceFilter" onchange="renderReviewsAdmin()">
          <option value="">Все места</option>
          <option>Иссык-Куль</option><option>Ала-Арча</option><option>Сон-Куль</option>
          <option>Каньон Сказка</option><option>Пик Ленина</option><option>Ош</option>
          <option>Арстанбап</option><option>Сары-Чeлек</option><option>Хан-Тенгри</option>
        </select>
        <select class="filter-select" id="reviewRatingFilter" onchange="renderReviewsAdmin()">
          <option value="">Все оценки</option>
          <option value="5">★★★★★</option>
          <option value="4">★★★★☆</option>
          <option value="3">★★★☆☆</option>
          <option value="2">★★☆☆☆</option>
          <option value="1">★☆☆☆☆</option>
        </select>
        <select class="filter-select" id="reviewTypeFilter" onchange="renderReviewsAdmin()">
          <option value="">Все типы</option>
          <option value="user">Пользовательские</option>
          <option value="default">Стандартные</option>
        </select>
        <span id="reviewCountBadge" style="font-size:.82rem;color:var(--a-gray);white-space:nowrap"></span>
      </div>

      <div class="card">
        <div class="card-body" style="padding:0">
          <table class="admin-table">
            <thead>
              <tr>
                <th style="width:40px">#</th>
                <th>Автор</th>
                <th>Место</th>
                <th>Оценка</th>
                <th>Текст отзыва</th>
                <th>Совет</th>
                <th>Тип</th>
                <th style="width:80px">Дата</th>
                <th style="width:80px">Действия</th>
              </tr>
            </thead>
            <tbody id="reviewsTableBody"></tbody>
          </table>
          <div class="empty-state" id="reviewsEmpty" style="display:none">
            <i class="fas fa-comment-slash"></i>
            <p>Отзывы не найдены</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ПРОСМОТР ОТЗЫВА -->
<div class="modal-overlay" id="reviewViewModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h3><i class="fas fa-star" style="color:var(--a-accent)"></i> Полный отзыв</h3>
      <button class="modal-close" onclick="closeModal('reviewViewModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="reviewViewBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('reviewViewModal')">Закрыть</button>
      <button class="btn btn-danger" id="reviewDeleteBtn"><i class="fas fa-trash"></i> Удалить</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
requireAuth();
initSidebar();

function renderReviewStats() {
  const all    = getReviews();
  const total  = all.length;
  const avg    = total ? (all.reduce((s,r)=>s+r.rating,0)/total).toFixed(1) : 0;
  const fiveStar = all.filter(r=>r.rating===5).length;
  const userR  = all.filter(r=>!r.isDefault).length;

  const grid = document.getElementById('reviewStatsGrid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-star"></i></div><div class="stat-info"><strong>${total}</strong><span>Всего отзывов</span></div></div>
    <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-chart-line"></i></div><div class="stat-info"><strong>${avg} ★</strong><span>Средний рейтинг</span></div></div>
    <div class="stat-card"><div class="stat-icon green"><i class="fas fa-thumbs-up"></i></div><div class="stat-info"><strong>${fiveStar}</strong><span>Отзывов 5★</span></div></div>
    <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-user"></i></div><div class="stat-info"><strong>${userR}</strong><span>Пользовательских</span></div></div>`;
}

function renderReviewsAdmin() {
  let reviews  = getReviews();
  const q      = document.getElementById('reviewSearch').value.toLowerCase();
  const place  = document.getElementById('reviewPlaceFilter').value;
  const rating = document.getElementById('reviewRatingFilter').value;
  const type   = document.getElementById('reviewTypeFilter').value;

  if (q)      reviews = reviews.filter(r => r.name.toLowerCase().includes(q) || r.text.toLowerCase().includes(q));
  if (place)  reviews = reviews.filter(r => r.place === place);
  if (rating) reviews = reviews.filter(r => r.rating === parseInt(rating));
  if (type === 'user')    reviews = reviews.filter(r => !r.isDefault);
  if (type === 'default') reviews = reviews.filter(r => r.isDefault);

  document.getElementById('reviewCountBadge').textContent = `Найдено: ${reviews.length}`;
  const tbody = document.getElementById('reviewsTableBody');
  const empty = document.getElementById('reviewsEmpty');

  if (!reviews.length) { tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';

  tbody.innerHTML = reviews.map((r,i) => `
    <tr>
      <td style="color:var(--a-gray);font-size:.8rem">${i+1}</td>
      <td>
        <div style="display:flex;align-items:center;gap:.6rem">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--a-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0">${escHtml(r.name.charAt(0))}</div>
          <div>
            <div class="name-cell" style="font-size:.88rem">${escHtml(r.name)}</div>
            ${r.country?`<div class="sub-text">${escHtml(r.country)}</div>`:''}
          </div>
        </div>
      </td>
      <td><span style="font-size:.82rem;font-weight:600"><i class="fas fa-map-marker-alt" style="color:var(--a-primary)"></i> ${escHtml(r.place)}</span></td>
      <td><span class="stars-sm">${'★'.repeat(r.rating)}</span></td>
      <td style="max-width:200px">
        <div style="font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px" title="${escHtml(r.text)}">${escHtml(r.text.slice(0,70))}...</div>
      </td>
      <td style="font-size:.78rem;color:var(--a-gray);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.tips?escHtml(r.tips.slice(0,40))+'...':'—'}</td>
      <td><span class="badge-tag ${r.isDefault?'hidden':'active'}">${r.isDefault?'Стандартный':'Пользователь'}</span></td>
      <td style="font-size:.78rem;color:var(--a-gray)">${r.date||'—'}</td>
      <td>
        <div style="display:flex;gap:.35rem">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="viewReview('${r.id}')" title="Просмотр"><i class="fas fa-eye"></i></button>
          <button class="btn btn-ghost btn-sm btn-icon" onclick="deleteReviewAdmin('${r.id}')" title="Удалить" style="color:var(--a-red)"><i class="fas fa-trash"></i></button>
        </div>
      </td>
    </tr>`).join('');
}

function viewReview(id) {
  const r = getReviews().find(x => x.id === id);
  if (!r) return;
  document.getElementById('reviewViewBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:.85rem;margin-bottom:1.25rem">
      <div style="width:50px;height:50px;border-radius:50%;background:var(--a-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem">${escHtml(r.name.charAt(0))}</div>
      <div>
        <strong style="font-size:1.05rem">${escHtml(r.name)}</strong>
        ${r.country?`<div style="font-size:.82rem;color:var(--a-gray)">${escHtml(r.country)}</div>`:''}
      </div>
      <div class="stars-sm" style="margin-left:auto;font-size:1.2rem">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
    </div>
    <div style="background:var(--a-light);border-radius:var(--a-radius-sm);padding:1rem;margin-bottom:1rem">
      <div style="font-size:.82rem;color:var(--a-gray);margin-bottom:.4rem"><i class="fas fa-map-marker-alt" style="color:var(--a-primary)"></i> ${escHtml(r.place)} · ${r.date||''}</div>
      <p style="font-size:.9rem;line-height:1.7">"${escHtml(r.text)}"</p>
    </div>
    ${r.tips?`<div style="background:#f0fdf4;border-radius:var(--a-radius-sm);padding:.85rem;font-size:.88rem"><i class="fas fa-lightbulb" style="color:var(--a-green)"></i> <em>${escHtml(r.tips)}</em></div>`:''}
    <div style="margin-top:1rem;font-size:.78rem;color:var(--a-gray)">
      ID: <code>${r.id}</code> · Тип: ${r.isDefault?'Стандартный':'Пользовательский'}
    </div>`;
  document.getElementById('reviewDeleteBtn').onclick = () => { closeModal('reviewViewModal'); deleteReviewAdmin(id); };
  openModal('reviewViewModal');
}

function deleteReviewAdmin(id) {
  const r = getReviews().find(x => x.id === id);
  adminConfirm(`Удалить отзыв от «${r?.name||id}»?`, () => {
    saveReviews(getReviews().filter(x => x.id !== id));
    adminToast('Отзыв удалён', 'warn');
    renderReviewStats();
    renderReviewsAdmin();
  });
}

function deleteAllUserReviews() {
  const userRevs = getReviews().filter(r => !r.isDefault);
  if (!userRevs.length) { adminToast('Нет пользовательских отзывов', 'warn'); return; }
  adminConfirm(`Удалить все ${userRevs.length} пользовательских отзывов?`, () => {
    saveReviews(getReviews().filter(r => r.isDefault));
    adminToast('Пользовательские отзывы удалены', 'warn');
    renderReviewStats();
    renderReviewsAdmin();
  }, 'Массовое удаление');
}

renderReviewStats();
renderReviewsAdmin();
</script>
</body>
</html>
