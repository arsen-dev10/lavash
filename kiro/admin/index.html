<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Админ панель VisitKyrgyzstan</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-mountain"></i>
        <h1>VisitKyrgyzstan</h1>
        <p>Панель управления сайтом</p>
        <span class="login-badge">ADMIN PANEL</span>
      </div>

      <div class="login-error" id="loginError">
        <i class="fas fa-exclamation-circle"></i>
        <span id="loginErrorMsg">Неверный логин или пароль</span>
      </div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label for="username">
            <i class="fas fa-user" style="color:var(--a-primary);margin-right:.35rem"></i>
            Логин
          </label>
          <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock" style="color:var(--a-primary);margin-right:.35rem"></i>
            Пароль
          </label>
          <div style="position:relative">
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required style="padding-right:2.5rem" />
            <button type="button" onclick="togglePass()" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--a-gray);font-size:.9rem" id="togglePassBtn">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="login-submit" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Войти в панель
        </button>
      </form>

      <div class="login-hint">
        <i class="fas fa-info-circle"></i>
        Логин: <code>admin</code> &nbsp;|&nbsp; Пароль: <code>admin123</code>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    // Если уже авторизован — сразу на дашборд
    if (localStorage.getItem('kg_admin_auth') === 'true') {
      window.location.href = 'dashboard.html';
    }

    function doLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn  = document.getElementById('loginBtn');

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Проверка...';
      btn.disabled = true;

      setTimeout(() => {
        // Получить сохранённые учётные данные или дефолтные
        const savedUser = localStorage.getItem('kg_admin_user') || 'admin';
        const savedPass = localStorage.getItem('kg_admin_pass') || 'admin123';

        if (user === savedUser && pass === savedPass) {
          localStorage.setItem('kg_admin_auth', 'true');
          localStorage.setItem('kg_admin_login_time', Date.now());
          btn.innerHTML = '<i class="fas fa-check"></i> Успешно!';
          btn.style.background = '#16a34a';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
        } else {
          document.getElementById('loginError').classList.add('show');
          document.getElementById('loginErrorMsg').textContent = 'Неверный логин или пароль. Попробуйте снова.';
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти в панель';
          btn.disabled = false;
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 700);
    }

    function togglePass() {
      const inp = document.getElementById('password');
      const ico = document.querySelector('#togglePassBtn i');
      if (inp.type === 'password') {
        inp.type = 'text';
        ico.className = 'fas fa-eye-slash';
      } else {
        inp.type = 'password';
        ico.className = 'fas fa-eye';
      }
    }
  </script>
</body>
</html>
